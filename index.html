<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenshin · Recordatorios</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b7343a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0e14; color: #e6edf3;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 24px; text-align: center; }
  .logo { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(135deg,#ff5a5f,#b7343a);
          display: grid; place-items: center; font-size: 46px; font-weight: 800; color: #fff; margin-bottom: 20px;
          box-shadow: 0 0 50px rgba(255,90,95,.35); }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  p { color: #8b98a9; margin-bottom: 24px; max-width: 340px; line-height: 1.5; }
  button { background: #ff5a5f; color: #fff; border: 0; border-radius: 12px; padding: 16px 28px;
           font-size: 1.05rem; font-weight: 600; cursor: pointer; width: 100%; max-width: 320px; }
  button:disabled { opacity: .5; }
  .status { margin-top: 20px; font-size: .9rem; padding: 12px 18px; border-radius: 10px; background: #151c28;
            border: 1px solid #1f2a3a; max-width: 320px; min-height: 20px; }
  .ok { color: #3fb950; }
  .err { color: #ff5a5f; }
</style>
</head>
<body>
  <div class="logo">緋</div>
  <h1>Recordatorios de Kenshin</h1>
  <p>Activá las notificaciones para recibir tus recordatorios, turnos y avisos directo en el celular.</p>
  <button id="btn">Activar notificaciones</button>
  <div class="status" id="status"></div>

<script>
// CONFIG: se completa en el deploy
const BACKEND = "https://masters-classic-bibliographic-cart.trycloudflare.com";

const statusEl = document.getElementById("status");
const btn = document.getElementById("btn");

function setStatus(msg, cls="") { statusEl.textContent = msg; statusEl.className = "status " + cls; }

function urlB64ToUint8(base64) {
  const pad = "=".repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function registerAndSubscribe() {
  try {
    btn.disabled = true;
    setStatus("Registrando…");
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;

    const perm = await Notification.requestPermission();
    if (perm !== "granted") { setStatus("Permiso denegado. Activalo en los ajustes del navegador.", "err"); btn.disabled=false; return; }

    const res = await fetch(BACKEND + "/vapid-public");
    const { key } = await res.json();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(key),
    });

    await fetch(BACKEND + "/subscribe", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(sub),
    });

    setStatus("✓ Notificaciones activadas. Ya podés cerrar la app.", "ok");
    btn.textContent = "Activado ✓";
  } catch (e) {
    setStatus("Error: " + e.message, "err");
    btn.disabled = false;
  }
}

btn.addEventListener("click", registerAndSubscribe);

// Si ya está suscripto, avisar
navigator.serviceWorker?.getRegistration().then(async reg => {
  if (reg) {
    const s = await reg.pushManager.getSubscription();
    if (s) { setStatus("✓ Ya estás recibiendo notificaciones.", "ok"); btn.textContent = "Activado ✓"; }
  }
});
</script>
</body>
</html>
